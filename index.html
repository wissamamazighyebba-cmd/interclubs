<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>Interclubs CN Marseille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style id="css">
/* Tableau de bassin, pensé téléphone : on choisit une course, tout le reste suit. */
:root{
  color-scheme:dark;
  --bg:#07131f;--panel:#0d1d2c;--panel2:#132a3f;--line:#1d3349;
  --ink:#ecf3f9;--muted:#8ea3b6;--dim:#5b7287;
  --us:#ffd23f;--us-ink:#1a1400;
  --gold:#f5c542;--silver:#cfd8e1;--bronze:#e0904f;
  --up:#43d18a;--down:#ff6b5e;--accent:#4da3ff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.n{font-variant-numeric:tabular-nums}

/* en-tête */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{margin:0;font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.hd p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.live.on{color:var(--ink)}.live.on i{background:var(--down);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,94,.6)}70%{box-shadow:0 0 0 7px rgba(255,107,94,0)}100%{box-shadow:0 0 0 0 rgba(255,107,94,0)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}

/* sélecteur de course */
.stage{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.stage .nav{width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:22px;line-height:1;cursor:pointer}
.stage .nav[disabled]{opacity:.25;cursor:default}
.stage .ttl{flex:1;min-width:0;text-align:center}
.stage .ttl small{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage .ttl b{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;align-items:center;gap:4px;padding:0 14px 12px}
.dots button{flex:1;height:22px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center}
.dots button i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);transition:height .15s,background .15s}
.dots button.on i{background:var(--muted)}
.dots button.cur i{background:var(--us);height:8px}
.dots .gap{flex:0 0 6px}
.ctrl{display:flex;gap:6px;padding:0 12px 12px}
.pill{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--down);border-color:var(--down);color:#fff}

/* classement */
.lb{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;position:relative}
.row:last-child{border-bottom:0}
.row .rk{font-family:var(--display);font-weight:800;font-size:16px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel2)}
.row .rk.m1{background:var(--gold);color:#1a1300}.row .rk.m2{background:var(--silver);color:#0b1520}.row .rk.m3{background:var(--bronze);color:#1a0d00}
.row .nm{min-width:0;display:flex;flex-direction:column}
.row .nm b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm b i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.row .nm span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.row .sc b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.row .sc span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.mv{font-size:11px;font-weight:700;margin-left:4px}
.mv.u{color:var(--up)}.mv.d{color:var(--down)}
.row.us{background:rgba(255,210,63,.1)}
.row.us::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--us)}
.row.dim{opacity:.4}
.row.sel{background:rgba(77,163,255,.1)}

/* graphique */
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 0}
.chart-h b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em}
.chart-h span{font-size:12px;color:var(--muted);text-align:right}
#chart{touch-action:pan-y;padding:4px 4px 6px}
#chart svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}

/* résultats de la course */
.res-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 6px}
.res-h b{font-family:var(--display);font-weight:800;font-size:17px}
.res-h span{font-size:12px;color:var(--muted)}
.res{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.res .r{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);grid-row:span 2;text-align:center}
.res .r.m1{color:var(--gold)}
.res .c{font-weight:700;display:flex;align-items:center;gap:7px;min-width:0;font-size:14.5px}
.res .c i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.res .p{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.res .w{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.res .t{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.res.us{background:rgba(255,210,63,.1)}
.empty{padding:14px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

/* saisie */
.adm{padding:14px;display:flex;flex-direction:column;gap:10px}
.adm h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.sub{font-size:13px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input:not([type=checkbox]),select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.big-btn{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:12px;padding:14px;background:var(--us);color:var(--us-ink);cursor:pointer;width:100%}
.big-btn[disabled]{opacity:.5}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.ghost.danger{color:var(--down)}
.msg{font-size:14px;min-height:20px}
.msg.ok{color:var(--up)}.msg.err{color:var(--down)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li span{flex:1;min-width:0}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- graphique : places course par course (1re place à gauche, courses de haut en bas) ---------- */
var GEO=null;
function renderChart(){
  var box=$("chart"),W=Math.max(300,Math.round(box.clientWidth-8)),teams=shown().filter(function(t){return done(t)>0});
  if(!teams.length){box.innerHTML='<p class="sub" style="padding:14px">Aucun résultat pour l’instant.</p>';return}
  var k=curK(),M=teams.length,L=88,R=34,Tp=30,rowH=40,Bt=70,H=Tp+(N-1)*rowH+Bt+14,fs=12;
  function x(r){return M===1?(L+W-R)/2:L+(r-1)*(W-L-R)/(M-1)}

  var ranks={};teams.forEach(function(t){ranks[t.id]=[]});
  for(var i=1;i<=N;i++)standing(i).forEach(function(s,j){if(ranks[s.t.id])ranks[s.t.id][i]=j+1});

  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Place de chaque club après chaque course">';
  /* en-têtes des places */
  for(var r=1;r<=M;r++){var col=r===1?'#f5c542':r===2?'#cfd8e1':r===3?'#e0904f':'#7f95a9';g+='<text x="'+x(r)+'" y="14" fill="'+col+'" font-size="13" font-weight="800" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif">'+(r===1?'1er':r+'e')+'</text>'}

  for(var i=1;i<=N;i++){var on=i===k;

    g+='<text x="8" y="'+(y(i)+4)+'" fill="'+(on?'#ffd23f':i<=k?'#c4d2de':'#5b7287')+'" font-size="'+fs+'" font-weight="'+(on?800:600)+'">'+esc(EV[ORDER[i-1]].l)+'</text>';
    if(i===sp)g+='<line x1="8" x2="'+(W-8)+'" y1="'+(y(i)+rowH/2)+'" y2="'+(y(i)+rowH/2)+'" stroke="#2d4a66" stroke-dasharray="3 4"/>';

    h+='<div class="res'+(t.us?' us':'')+'"><span class="r'+(i===0?' m1':'')+'">'+(i+1)+'</span><span class="c"><i style="background:'+tcolor(t)+'"></i>'+esc(nm(t))+'</span><span class="p">'+fmt(x.p)+'</span><span class="w">'+esc(e.relay?sw.join(", "):(sw[0]||""))+'</span><span class="t">'+esc(x.t||"")+'</span></div>';
  });
  $("resbox").innerHTML=h;
}
function setK(v){ui.k=Math.max(1,Math.min(N,v));if(ui.k===autoStage())ui.k=null;renderTop();renderChart();renderEv()}
function stopPlay(){if(ui.play){clearInterval(ui.play);ui.play=null}}
function hideTip(){}
function chartK(ev){var svg=$("chart").querySelector("svg");if(!svg||!GEO)return 0;var rc=svg.getBoundingClientRect(),py=(ev.clientY-rc.top)*GEO.W/rc.width;var c=Math.round((py-GEO.y(1))/GEO.rowH)+1;return c>=1&&c<=N?c:0}
$("chart").addEventListener("click",function(ev){var c=chartK(ev);if(c){stopPlay();setK(c)}});

/* ---------- saisie ---------- */
function renderAdmin(){
  var a=$("admin");
  if(ui.login&&!ui.admin){a.innerHTML='<section class="card adm"><h2>Accès saisie</h2><p class="sub">'+(REMOTE?'Entre le code pour saisir les résultats.':'Mode local : les saisies restent sur cet appareil.')+'</p><form id="login" class="grid2"><label class="full" for="pin">Code<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><div class="full"><button class="big-btn" type="submit">Entrer</button></div><div class="full msg '+ui.msgKind+'">'+esc(ui.msg)+'</div></form></section>';return}
  if(!ui.admin){a.innerHTML="";return}
  var t=T(ui.adm.team)||ref();ui.adm.team=t.id;
  if(!ui.adm.ev||ORDER.indexOf(ui.adm.ev)<0)ui.adm.ev=ORDER.filter(function(id){return!has(t,id)})[0]||ORDER[0];
  var id=ui.adm.ev,x=t.results[id]||{};
  var h='<section class="card"><h2>Saisie</h2><form id="qform" class="grid2">';
  h+='<label class="full" for="q-team">Club<select id="q-team">'+state.teams.map(function(z){return'<option value="'+esc(z.id)+'"'+(z===t?' selected':'')+'>'+esc(z.name)+'</option>'}).join("")+'</select></label>';
  h+='<label class="full" for="q-ev">Course<select id="q-ev">'+ORDER.map(function(z,i){return'<option value="'+z+'"'+(z===id?' selected':'')+'>'+(i+1)+'. '+esc(EV[z].f)+(has(t,z)?' ✓':'')+'</option>'}).join("")+'</select></label>';
  h+='<label for="q-p">Points<input id="q-p" inputmode="numeric" autocomplete="off" value="'+(x.p!=null?x.p:'')+'" placeholder="1250"></label>';
  h+='<label for="q-t">Temps<input id="q-t" autocomplete="off" value="'+esc(x.t||'')+'" placeholder="1:02.35"></label>';
  h+='<label class="full" for="q-s">'+(EV[id].relay?'Relayeurs dans l’ordre, séparés par des virgules':'Nageur')+'<input id="q-s" autocomplete="off" value="'+esc((x.s||[]).join(", "))+'"></label>';
  h+='<div class="full"><button class="big-btn" type="submit"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Envoi…':'Valider')+'</button></div><div class="full msg '+ui.msgKind+'" id="msg">'+esc(ui.msg)+'</div></form>';
  if(has(t,id))h+='<button class="ghost danger" id="q-del">Effacer ce résultat</button>';
  h+='</section>';
  h+='<section class="card"><h2>Clubs</h2><div class="grid2"><label class="full" for="nc">Nouveau club<input id="nc" placeholder="Nom court, ex. Nice 1"></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="nc-us" style="width:auto"> c’est nous</label><button class="ghost" id="nc-add">Ajouter</button></div><div class="list">';
  state.teams.forEach(function(z){h+='<div class="li"><span>'+esc(z.name)+' <span class="sub">'+done(z)+'/'+N+'</span></span>'+(ui.delAsk===z.id?'<button class="ghost danger" data-delok="'+esc(z.id)+'">Confirmer</button><button class="ghost" data-delno="1">Annuler</button>':'<button class="ghost" data-del="'+esc(z.id)+'">Retirer</button>')+'</div>'});
  h+='</div></section>';
  h+='<section class="card"><h2>Sauvegarde</h2><textarea id="io" spellcheck="false" aria-label="Données"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="io-out">Afficher les données</button><button class="ghost" id="io-in">Importer le texte collé</button><button class="ghost" id="logout">Quitter la saisie</button></div></section>';
  a.innerHTML=h.replace(/<section class="card">/g,'<section class="card adm">');
}

function renderFoot(){$("foot").innerHTML='<span>'+(state.updated?'Mis à jour '+new Date(state.updated).toLocaleString("fr-FR",{weekday:"short",hour:"2-digit",minute:"2-digit"}):'')+'</span>'+((ui.admin||ui.login||(INART&&!CAN))?'':'<button id="open-login">Accès saisie</button>')}
function renderAll(){renderTop();renderChart();renderEv();renderAdmin();renderFoot()}

/* ---------- données ---------- */
/* Page publiée : on régénère le document complet avec les nouvelles données. */
function buildDoc(next){
  var reset="";try{var st=document.head.querySelector("style");if(st&&st.id!=="css")reset=st.textContent}catch(e){}
  if(!reset)reset=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var link=document.querySelector('link[rel="stylesheet"]');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(document.title)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    (link?'<link rel="stylesheet" href="'+link.getAttribute("href").replace(/&/g,"&amp;")+'">\n':'')+
    '<style id="css">'+$("css").textContent+'<\/style>\n'+
    '<template id="shell">'+$("shell").innerHTML+'<\/template>\n<div id="root"></div>\n'+
    '<script type="application/json" id="data">'+JSON.stringify(next).replace(/</g,"\\u003c")+'<\/script>\n'+
    '<script id="main">'+$("main").textContent+'<\/script></body></html>';
}
async function commit(next){
  next.updated=new Date().toISOString();
  if(REMOTE){
    if(!sb)throw new Error("Pas de connexion");
    var r=await sb.rpc("ic_save",{p_pin:ui.pin,p_id:CONFIG.rowId,p_data:next});
    if(r.error)throw new Error(r.error.message.indexOf("pin")>=0?"Code refusé":r.error.message);
  }else if(ART){
    try{await ART.publish(buildDoc(next))}
    catch(e){var c=e&&e.code;throw new Error(c==="conflict"?"Quelqu\u2019un a publié en même temps, la page se recharge.":(c==="not_writer"||c==="not_granted")?"Tu n\u2019as pas le droit de modifier cette page.":"Publication impossible ("+(c||"erreur")+")")}
  }else{try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){}}
  state=next;
}
async function save(next,ok){ui.busy=true;try{await commit(next);ui.msg=ok;ui.msgKind="ok"}catch(e){ui.msg=e.message||"Erreur";ui.msgKind="err"}ui.busy=false;renderAll()}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  if(b.dataset.step){stopPlay();setK(curK()+(+b.dataset.step));return}
  if(b.dataset.k){stopPlay();setK(+b.dataset.k);return}
  if(b.id==="golive"){stopPlay();setK(autoStage());return}
  if(b.id==="play"){if(ui.play){stopPlay();renderTop();return}var v=1;ui.k=1;ui.play=setInterval(function(){v++;if(v>autoStage()){stopPlay();setK(autoStage());return}ui.k=v;renderTop();renderChart();renderEv()},1100);renderTop();renderChart();renderEv();return}
  if(b.classList.contains("row")&&b.dataset.id){ui.focus=ui.focus===b.dataset.id?null:b.dataset.id;renderTop();renderChart();return}
  if(b.id==="open-login"&&CAN){ui.admin=true;ui.msg="";renderAdmin();renderFoot();$("admin").scrollIntoView({behavior:"smooth"});return}
  if(b.id==="open-login"){ui.login=true;ui.msg="";renderAdmin();renderFoot();$("admin").scrollIntoView({behavior:"smooth"});return}
  if(b.id==="logout"){ui.admin=false;ui.login=false;ui.pin="";renderAll();return}
  if(b.id==="q-del"){var n=clone(state);delete n.teams.filter(function(z){return z.id===ui.adm.team})[0].results[ui.adm.ev];save(n,"Résultat effacé");return}
  if(b.id==="nc-add"){var v=$("nc").value.trim();if(!v)return;var n2=clone(state);n2.teams.push({id:"c"+Date.now().toString(36),name:v,short:v,us:$("nc-us").checked,honor:!!($("nc-hon")&&$("nc-hon").checked),results:{}});save(n2,"Club ajouté");return}
  if(b.dataset.del){ui.delAsk=b.dataset.del;renderAdmin();return}
  if(b.dataset.delno){ui.delAsk=null;renderAdmin();return}
  if(b.dataset.delok){var n3=clone(state);n3.teams=n3.teams.filter(function(z){return z.id!==b.dataset.delok});ui.delAsk=null;save(n3,"Club retiré");return}
  if(b.id==="io-out"){$("io").value=JSON.stringify(state);$("io").select();return}
  if(b.id==="io-in"){try{var dd=JSON.parse($("io").value);if(!dd.teams)throw 0;save(dd,"Données importées")}catch(e){$("io").value="Texte invalide"}return}
});
document.addEventListener("submit",async function(ev){
  ev.preventDefault();
  if(ev.target.id==="login"){
    var pin=$("pin").value.trim();
    if(REMOTE){
      if(!sb){ui.msg="Connexion en cours, réessaie.";ui.msgKind="err";renderAdmin();return}
      var r=await sb.rpc("ic_check",{p_pin:pin});
      if(r.error||!r.data){ui.msg="Code incorrect";ui.msgKind="err";renderAdmin();return}
    }
    ui.pin=pin;ui.admin=true;ui.msg="";renderAdmin();renderFoot();return;
  }
  if(ev.target.id==="qform"){
    var p=$("q-p").value.replace(/\s/g,""),n=parseInt(p,10);
    if(p===""||isNaN(n)){$("msg").textContent="Entre les points";$("msg").className="full msg err";return}
    var next=clone(state),t=next.teams.filter(function(z){return z.id===ui.adm.team})[0],id=ui.adm.ev;
    t.results[id]={p:n,t:$("q-t").value.trim(),s:$("q-s").value.split(",").map(function(s){return s.trim()}).filter(Boolean)};
    var nx=ORDER.filter(function(z){return!t.results[z]})[0];
    ui.busy=true;
    try{await commit(next);ui.msg=EV[id].l+" enregistré : "+fmt(n)+" pts";ui.msgKind="ok";ui.adm.ev=nx||id}
    catch(e){ui.msg=e.message||"Erreur";ui.msgKind="err"}
    ui.busy=false;renderAll();
  }
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="q-team"){ui.adm.team=ev.target.value;ui.adm.ev=null;ui.msg="";renderAdmin()}
  if(ev.target.id==="q-ev"){ui.adm.ev=ev.target.value;ui.msg="";renderAdmin()}
});
var rw=0;window.addEventListener("resize",function(){clearTimeout(rw);rw=setTimeout(renderChart,120)});
if(location.hash==="#saisie")ui.login=true;

/* ---------- direct Supabase ---------- */
function applyRemote(row){
  if(!row||!row.data||!row.data.teams)return;
  state=row.data;renderTop();renderChart();renderEv();renderFoot();
  if(ui.admin&&!ui.busy){var a=document.activeElement;if(!a||!a.closest||!a.closest("form"))renderAdmin()}
}
function connect(){
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
  s.onload=async function(){
    sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);
    var r=await sb.from("interclubs").select("data").eq("id",CONFIG.rowId).maybeSingle();
    if(r.data)applyRemote(r.data);else renderTop();
    sb.channel("ic-"+CONFIG.rowId).on("postgres_changes",{event:"*",schema:"public",table:"interclubs",filter:"id=eq."+CONFIG.rowId},function(p){applyRemote(p.new)}).subscribe();
    setInterval(async function(){var q=await sb.from("interclubs").select("data").eq("id",CONFIG.rowId).maybeSingle();if(q.data&&q.data.data&&q.data.data.updated!==state.updated)applyRemote(q.data)},30000);
  };
  s.onerror=function(){$("live").querySelector("span").textContent="Hors ligne"};
  document.head.appendChild(s);
}

renderAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(renderChart);
if(REMOTE)connect();
if(INART)Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(async function(r){
  ART=r[0];var u=r[1];try{CAN=!!(ART&&u&&await u.canEdit())}catch(e){CAN=false}
  renderTop();renderFoot();
}).catch(function(){});
})();
</script>
