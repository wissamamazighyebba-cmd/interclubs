<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06121d">
<title>Interclubs CN Marseille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style id="css">
/* Classement collant en haut, puis un seul graphique : l'écart au leader course après course. */
:root{
  color-scheme:dark;
  --bg:#06121d;--panel:#0c1c2b;--panel2:#11263a;--line:#1c3349;
  --ink:#eaf2f8;--muted:#8aa0b4;--dim:#5d7488;
  --us:#ffd23f;--us-ink:#1a1400;
  --gold:#f5c542;--silver:#cfd8e1;--bronze:#e0904f;
  --blue:#4da3ff;--up:#43d18a;--down:#ff6b5e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* haut collant */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:8px;box-shadow:0 8px 16px -10px rgba(0,0,0,.6)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.live.on{color:var(--ink)}
.live.on i{background:var(--down);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,94,.6)}70%{box-shadow:0 0 0 8px rgba(255,107,94,0)}100%{box-shadow:0 0 0 0 rgba(255,107,94,0)}}
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;padding-bottom:3px}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--us) 0 12px,#d8443a 12px 24px,#f4f7fa 24px 36px,#2f6fd0 36px 48px)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px 4px}
.board-head b{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.board-head span{font-size:12.5px;color:var(--muted);text-align:right}
.lb{display:flex;flex-direction:column;padding:0 6px 7px}
.lbr{display:grid;grid-template-columns:34px 1fr auto 70px;align-items:center;gap:8px;padding:5px 6px;border-radius:9px}
.lbr .m{font-family:var(--display);font-weight:800;font-size:15px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#0b1520;background:var(--panel2)}
.lbr .m.m1{background:var(--gold)}.lbr .m.m2{background:var(--silver)}.lbr .m.m3{background:var(--bronze)}
.lbr .m.mx{color:var(--ink)}
.lbr .t{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:8px}
.lbr .t i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.lbr .t small{font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted)}
.lbr .p{font-family:var(--display);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums;text-align:right}
.lbr .g{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lbr.us{background:var(--us);color:var(--us-ink)}
.lbr.us .g,.lbr.us .t small{color:rgba(26,20,0,.7)}
.lbr.us .m.mx{background:rgba(26,20,0,.12);color:var(--us-ink)}
.lbr.us .t i{box-shadow:0 0 0 2px var(--us-ink)}
.lbr.sep{margin-top:3px}
.lbr.flash{animation:flash .6s}
.nowline{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.nowline b{color:var(--us);font-family:var(--display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.nowline .chip{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--us);color:var(--us-ink);border-radius:6px;padding:2px 8px;white-space:nowrap}
@keyframes flash{0%{transform:translateX(-6px);opacity:.3}100%{transform:none;opacity:1}}

/* graphique */
main{display:flex;flex-direction:column;gap:12px;padding-block:12px 30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{font-size:13px;color:var(--muted)}
#chart{width:100%;min-height:300px;touch-action:pan-y}
#chart svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
#chart .col{cursor:pointer}
#chart .dotp{cursor:pointer;transition:r .2s}

#chart{position:relative}
.tip{position:absolute;z-index:3;width:min(250px,86%);background:#f2f7fb;color:#0b1520;border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13px;line-height:1.35;pointer-events:none;display:flex;flex-direction:column;gap:3px}
.tip-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tip-h i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px #0b1520}
.tip-h b{font-family:var(--display);font-size:17px;font-weight:800}
.tip-h span{margin-left:auto;font-family:var(--display);font-weight:700;color:#4a5f73;font-size:14px}
.tip-sw{font-weight:600}
.tip-p{display:flex;align-items:baseline;gap:8px}
.tip-p b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tip-p span{color:#4a5f73;font-variant-numeric:tabular-nums}
.tip-r{color:#3b4f62;font-variant-numeric:tabular-nums}
.tip .gold{background:#f5c542;color:#1a1300;font-weight:700;border-radius:5px;padding:1px 6px}
.tip .neg{color:#c2332a;font-weight:600}
/* course sélectionnée */
.sel-head{display:flex;align-items:center;gap:10px}
.sel-head .nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:18px;flex:0 0 auto}
.sel-head .nav[disabled]{opacity:.3;cursor:default}
.sel-title{flex:1;min-width:0;text-align:center}
.sel-title small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--display);font-weight:700}
.sel-title b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.leadline{text-align:center;font-size:13.5px;color:var(--muted)}
.leadline b{color:var(--ink)}
.srow{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:9px 8px;border-radius:10px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow.us{background:rgba(255,210,63,.12);border-top-color:transparent}
.srow.hl{box-shadow:inset 0 0 0 2px var(--blue)}
.srow .sr{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);grid-row:span 2;text-align:center}
.srow .sn{font-weight:700;display:flex;align-items:center;gap:7px;min-width:0}
.srow .sn i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.srow .sc{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.srow .sw{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.srow .sw b{color:var(--ink);font-weight:600}
.srow .sg{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* saisie */
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input:not([type=checkbox]),select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.big-btn{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:12px;padding:14px;background:var(--us);color:var(--us-ink);cursor:pointer;width:100%}
.big-btn[disabled]{opacity:.5}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.ghost.danger{color:var(--down)}
.msg{font-size:14px;min-height:20px}
.msg.ok{color:var(--up)}.msg.err{color:var(--down)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li span{flex:1;min-width:0}
.li b{font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);padding-bottom:20px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}

.lbr{padding:3px 6px}
.lbr .m{width:24px;height:24px;font-size:14px}
.lbr .t{font-size:17px}
.lbr .p{font-size:20px}
.top{position:static;box-shadow:none}
body::before{display:none}
.ev-head{display:flex;align-items:center;gap:10px}
.ev-head .nav{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px;flex:0 0 auto}
.ev-head .nav[disabled]{opacity:.3;cursor:default}
.ev-title{flex:1;min-width:0;text-align:center}
.ev-title small{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ev-title b{font-family:var(--display);font-weight:800;font-size:22px}
.er{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line)}
.er.us{background:rgba(255,210,63,.12);border-radius:8px}
.erk{font-family:var(--display);font-weight:800;font-size:15px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--panel2)}
.erk.m1{background:var(--gold);color:#1a1300}.erk.m2{background:var(--silver);color:#0b1520}.erk.m3{background:var(--bronze);color:#1a0d00}
.ern{display:flex;flex-direction:column;min-width:0}
.erc{display:flex;align-items:center;gap:7px;font-weight:700}
.erc i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.ers{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.erp{display:flex;flex-direction:column;align-items:flex-end}
.erp b{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.erp span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lbr{position:relative;background:var(--panel)}
.lbr.us{background:var(--us)}
.scrub{display:flex;align-items:center;gap:10px;padding:4px 12px 12px}
.sbtn{flex:0 0 auto;height:34px;min-width:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12px;color:var(--ink)}
.sbtn.txt{font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:0 10px}
.sbtn.txt[aria-pressed="true"]{background:var(--down);border-color:var(--down);color:#fff}
#stage{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;padding:0;border:0}
#stage::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--us) var(--pct,100%),var(--line) var(--pct,100%))}
#stage::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
#stage::-moz-range-progress{height:6px;border-radius:3px;background:var(--us)}
#stage::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid var(--us);margin-top:-8px}
#stage::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:4px solid var(--us)}
@media (max-width:400px){.lbr{grid-template-columns:30px 1fr auto 62px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<template id="shell">
<div class="top" id="top">
  <div class="shell">
    <div class="bar">
      <div class="brand"><b>Interclubs Messieurs</b><span>CN Marseille · suivi en direct</span></div>
      <div class="live" id="live"><i></i><span>Local</span></div>
    </div>
    <section class="board" aria-label="Classement">
      <div class="board-head"><b id="bhead">Classement</b><span id="bsub"></span></div>

      <div class="scrub"><button class="sbtn" id="stplay" aria-label="Lecture">&#9654;</button><input type="range" id="stage" min="1" max="13" step="1" value="13" aria-label="Course du programme"><button class="sbtn txt" id="stlive" aria-pressed="true">Direct</button></div>
    </section>
  </div>
</div>
<main class="shell">
  <section class="card">
    <div id="chart"></div>
  </section>
  <section class="card" id="evp" hidden></section>
  <div id="admin"></div>
</main>
<div class="shell foot" id="foot"></div>

</template>

function standing(k){return state.teams.filter(function(t){return done(t)>0&&stageOf(t)>=k}).map(function(t){return{t:t,c:cumAt(t,k)}}).sort(function(a,b){return b.c-a.c})}
function liveStage(){var k=stageOf(ref());return k||N}
function swimmers(x,relay){var s=x.s||[];return relay?s.join(", "):(s[0]||"")}

/* Stade par défaut : le nôtre si on a commencé, sinon celui du club le moins avancé. */
function autoStage(){var k=stageOf(ref());if(k)return k;var K=N;state.teams.forEach(function(t){if(!t.us&&done(t)>0)K=Math.min(K,stageOf(t))});return K}

function renderTop(){
  var r=ref(),k=stageOf(r),live=k>0,auto=autoStage(),K=ui.stage||auto;
  var st=standing(K);

  $("bsub").textContent=K+"/"+N+" · "+EV[ORDER[K-1]].l;
  var rg=$("stage");rg.max=N;rg.value=K;rg.style.setProperty("--pct",((K-1)/(N-1)*100)+"%");

  var before={};Array.prototype.forEach.call($("lb").children,function(el){if(el.dataset.id)before[el.dataset.id]=el.getBoundingClientRect().top});

    var gap=i===0?(st[1]?"+"+fmt(s.c-st[1].c):""):sgn(s.c-lead);
    return'<div data-id="'+esc(s.t.id)+'" class="lbr'+(s.t.us?' us':'')+(o.sep?' sep':'')+'"><span class="m '+(i<3?'m'+(i+1):'mx')+'">'+(i+1)+'</span><span class="t"><i style="background:'+tcolor(s.t)+'"></i>'+esc(nm(s.t))+'</span><span class="p">'+fmt(s.c)+'</span><span class="g">'+gap+'</span></div>';

/* Compteur : points à marquer sur la prochaine course pour passer (ou rester) devant le club visé. */
function nextTarget(){
  var r=ref(),k=stageOf(r);if(k>=N)return null;
  var others=state.teams.filter(function(t){return t!==r&&stageOf(t)>=k+1});if(!others.length)return null;
  var mine=cumAt(r,k),club,mode;
  if(k===0){club=others.sort(function(a,b){return cumAt(b,1)-cumAt(a,1)})[0];mode="prendre la tête devant"}
  else{
    var ahead=others.filter(function(t){return cumAt(t,k)>mine}).sort(function(a,b){return cumAt(a,k)-cumAt(b,k)});
    if(ahead.length){club=ahead[0];mode=ahead.length===1?"prendre la tête devant":"passer devant"}
    else{club=others.sort(function(a,b){return cumAt(b,k+1)-cumAt(a,k+1)})[0];mode="rester devant"}
  }
  return{k:k,id:ORDER[k],club:club,mode:mode,need:cumAt(club,k+1)-mine+1};
}
/* Graphique : les 5 meilleurs clubs au total final, plus le CNM s'il n'en fait pas partie. */
var TOP=5;
function chartTeams(){
  /* Les 5 meilleurs clubs au même stade (celui du club le moins avancé), plus le CNM et les clubs toujours affichés. */
  var K=autoStage(),top=standing(K).filter(function(x){return !x.t.us}).slice(0,TOP).map(function(x){return x.t});
  var extra=state.teams.filter(function(t){return (t.us||t.honor)&&done(t)>0&&top.indexOf(t)<0});
  return top.concat(extra);
}
/* ---------- graphique ---------- */
var PTS=[],GEO=null;
function raceBest(id){var b=null;chartTeams().forEach(function(t){if(has(t,id)&&(!b||pts(t,id)>pts(b,id)))b=t});return b}
function renderChart(){
  var box=$("chart"),W=Math.max(300,Math.round(box.clientWidth));
  var teams=chartTeams();
  if(!teams.length){box.innerHTML='<p class="sub">Aucun résultat pour l’instant.</p>';return}
  var narrow=W<520,H=narrow?430:460,L=narrow?50:60,R=narrow?10:16,Tp=22,B=narrow?66:72,fs=narrow?11.5:13;
  var plotH=H-Tp-B;
  var series=teams.map(function(t){var p=[];for(var i=1;i<=stageOf(t);i++){var lead=standing(i)[0];p.push({i:i,v:cumAt(t,i)-lead.c})}return{t:t,p:p}});
  var min=0;series.forEach(function(s){s.p.forEach(function(q){if(q.v<min)min=q.v})});
  var step=min<-2000?500:min<-600?250:100;min=Math.min(-step,Math.floor(min/step)*step);
  function x(i){return L+12+(i-1)*(W-L-R-12)/(N-1)}
  function y(v){return Tp+(v/min)*plotH}
  var cw=(W-L-R-12)/(N-1);
  GEO={x:x,y:y,cw:cw,W:W,H:H,Tp:Tp,B:B};
  var g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Écart au club en tête, course après course">';
  g+='<defs>'+series.map(function(s,j){var c=tcolor(s.t);return'<linearGradient id="ga'+j+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity="0"/><stop offset="1" stop-color="'+c+'" stop-opacity="'+(s.t.us?.22:.12)+'"/></linearGradient>'}).join("")+'</defs>';
  if(ui.ev)g+='<rect x="'+(x(ui.ev)-cw/2)+'" y="4" width="'+cw+'" height="'+(H-10)+'" rx="6" fill="#ffd23f" opacity=".08"/>';
  g+='<rect id="hcol" x="0" y="4" width="'+cw+'" height="'+(H-10)+'" rx="6" fill="#4da3ff" opacity="0"/>';
  for(var v=0;v>=min;v-=step)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===0?'#2c4b68':'#16293b')+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" fill="#8aa0b4" font-size="'+fs+'" text-anchor="end">'+(v===0?'tête':sgn(v))+'</text>';
  var split=REUNIONS[0].ev.length,sx=(x(split)+x(split+1))/2;
  g+='<line x1="'+sx+'" x2="'+sx+'" y1="6" y2="'+(H-B+4)+'" stroke="#3a536b" stroke-dasharray="3 4"/>';
  g+='<text x="'+(sx-6)+'" y="'+(H-B-6)+'" fill="#5d7488" font-size="'+(fs-1)+'" text-anchor="end">Réunion 1</text><text x="'+(sx+6)+'" y="'+(H-B-6)+'" fill="#5d7488" font-size="'+(fs-1)+'">Réunion 2</text>';
  ORDER.forEach(function(id,i){g+='<text class="xl" style="cursor:pointer" data-i="'+(i+1)+'" transform="translate('+x(i+1)+','+(H-B+14)+') rotate(-55)" fill="#8aa0b4" font-size="'+fs+'" text-anchor="end">'+esc(EV[id].l)+'</text>'});
  series.sort(function(a,b){return(a.t.us?1:0)-(b.t.us?1:0)});
  series.forEach(function(s){var j=teams.indexOf(s.t),p2=s.p.map(function(q){return x(q.i)+","+y(q.v)}).join(" ");
    g+='<polygon fill="url(#ga'+j+')" points="'+x(s.p[0].i)+','+y(0)+' '+p2+' '+x(s.p[s.p.length-1].i)+','+y(0)+'"/>'});
  series.forEach(function(s){g+='<polyline fill="none" stroke="'+tcolor(s.t)+'" stroke-width="'+(s.t.us?4:2.5)+'" stroke-linejoin="round" stroke-linecap="round" points="'+s.p.map(function(q){return x(q.i)+","+y(q.v)}).join(" ")+'"/>'});
  PTS=[];
  series.forEach(function(s){var c=tcolor(s.t);
    s.p.forEach(function(q){var id=ORDER[q.i-1],best=raceBest(id)===s.t,cx=x(q.i),cy=y(q.v);
      PTS.push({t:s.t,i:q.i,x:cx,y:cy});
      if(best)g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(s.t.us?9:8)+'" fill="none" stroke="#f5c542" stroke-width="2.5"/>';
      g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(s.t.us?5:4)+'" fill="'+c+'" stroke="#0c1c2b" stroke-width="2"/>';
    });
  });
  var labels=series.map(function(s){var l=s.p[s.p.length-1];var atEnd=l.i>=N-1;return{t:s.t,x:x(l.i)+(atEnd?-4:12),y:l.v===0?y(0)+fs+10:y(l.v)+(atEnd?-14:4),anchor:atEnd?'end':'start'}});
  labels.forEach(function(l){l.y=Math.max(Tp+fs+12,l.y)});
  labels.sort(function(a,b){return a.y-b.y});
  for(var k=1;k<labels.length;k++){if(Math.abs(labels[k].x-labels[k-1].x)<120&&labels[k].y-labels[k-1].y<fs+5)labels[k].y=labels[k-1].y+fs+5}
  labels.forEach(function(l){g+='<text x="'+l.x+'" y="'+l.y+'" fill="'+tcolor(l.t)+'" font-size="'+(fs+2)+'" font-weight="700" text-anchor="'+l.anchor+'" paint-order="stroke" stroke="#0c1c2b" stroke-width="4">'+esc(nm(l.t))+'</text>'});
  g+='<circle id="hdot" r="10" fill="none" stroke="#eaf2f8" stroke-width="2" opacity="0"/>';
  g+='</svg><div class="tip" id="tip" hidden></div>';
  box.innerHTML=g;
  if(ui.hover)showTip(ui.hover.t,ui.hover.i);
}
function colAt(ev){
  var svg=$("chart").querySelector("svg");if(!svg||!GEO)return 0;
  var rc=svg.getBoundingClientRect(),sc=GEO.W/rc.width,px=(ev.clientX-rc.left)*sc;
  var c=Math.round((px-GEO.x(1))/GEO.cw)+1;return c>=1&&c<=N?c:0;
}
/* Détail d'une course : classement de tous les clubs sur cette course. */
function renderEv(){
  var box=$("evp");if(!ui.ev){box.hidden=true;return}
  var k=ui.ev,id=ORDER[k-1],e=EV[id],list=evOrder(id);
  var h='<div class="ev-head"><button class="nav" data-evstep="-1" aria-label="Course précédente"'+(k<=1?' disabled':'')+'>\u2039</button><div class="ev-title"><small>Course '+k+'/'+N+'</small><b>'+esc(e.f)+'</b></div><button class="nav" data-evstep="1" aria-label="Course suivante"'+(k>=N?' disabled':'')+'>\u203a</button></div>';
  if(!list.length)h+='<p class="sub">Pas encore de résultat sur cette course.</p>';
  list.forEach(function(t,i){var x=t.results[id],sw=x.s||[];
    h+='<div class="er'+(t.us?' us':'')+'"><span class="erk'+(i<3?' m'+(i+1):'')+'">'+(i+1)+'</span><span class="ern"><span class="erc"><i style="background:'+tcolor(t)+'"></i>'+esc(nm(t))+'</span><span class="ers">'+esc(e.relay?sw.join(", "):(sw[0]||''))+'</span></span><span class="erp"><b>'+fmt(x.p)+'</b><span>'+esc(x.t||'')+'</span></span></div>';
  });
  box.innerHTML=h;box.hidden=false;
}
function nearest(ev){
  var svg=$("chart").querySelector("svg");if(!svg||!PTS.length)return null;
  var rc=svg.getBoundingClientRect(),sc=GEO.W/rc.width,px=(ev.clientX-rc.left)*sc,py=(ev.clientY-rc.top)*sc;
  var col=Math.round((px-GEO.x(1))/GEO.cw)+1;if(col<1||col>N)return null;
  var best=null,bd=1e9;
  PTS.forEach(function(p){var d=Math.abs(p.x-px)*2+Math.abs(p.y-py);if(p.i===col&&d<bd){bd=d;best=p}});
  return best;
}
function showTip(t,i){
  var tip=$("tip"),p=PTS.filter(function(q){return q.t===t&&q.i===i})[0];if(!tip||!p){hideTip();return}
  ui.hover={t:t,i:i};
  var id=ORDER[i-1],e=EV[id],x=t.results[id]||{},st=standing(i),best=raceBest(id),gr=0,lead=st[0].c,cum=0;
  st.forEach(function(s,j){if(s.t===t){gr=j+1;cum=s.c}});
  var er=0;evOrder(id).forEach(function(z,j){if(z===t)er=j+1});
  var diff=pts(t,id)-pts(best,id);
  var sw=x.s||[];
  var h='<div class="tip-h"><i style="background:'+tcolor(t)+'"></i><b>'+esc(nm(t))+'</b><span>'+(i)+'. '+esc(e.l)+'</span></div>';
  h+='<div class="tip-sw">'+(e.relay?(sw.length?esc(sw.join(", ")):'Relais'):esc(sw[0]||''))+'</div>';
  h+='<div class="tip-p"><b>'+fmt(x.p)+' pts</b>'+(x.t?'<span>'+esc(x.t)+'</span>':'')+'</div>';
  if(er===1&&evOrder(id).length>1)h+='<div class="tip-r"><span class="gold">Meilleur sur la course</span></div>';
  h+='<div class="tip-r">Général : <b>'+ord(gr)+'</b> · '+fmt(cum)+' pts'+(gr>1?' · '+sgn(cum-lead):'')+'</div>';
  tip.innerHTML=h;tip.hidden=false;
  var svg=$("chart").querySelector("svg"),rc=svg.getBoundingClientRect(),sc=rc.width/GEO.W,bw=$("chart").clientWidth;
  var tw=tip.offsetWidth,th=tip.offsetHeight,lx=p.x*sc-tw/2,ly=p.y*sc;
  lx=Math.max(0,Math.min(bw-tw,lx));
  ly=(ly-th-16>0)?ly-th-16:ly+18;
  tip.style.left=lx+"px";tip.style.top=ly+"px";
  var hc=$("hcol");hc.setAttribute("x",GEO.x(i)-GEO.cw/2);hc.setAttribute("opacity",".12");
  var hd=$("hdot");hd.setAttribute("cx",p.x);hd.setAttribute("cy",p.y);hd.setAttribute("opacity","1");
  Array.prototype.forEach.call(svg.querySelectorAll(".xl"),function(el){var on=+el.dataset.i===i;el.setAttribute("fill",on?"#eaf2f8":"#8aa0b4");el.setAttribute("font-weight",on?"700":"400")});
}
function hideTip(){ui.hover=null;var tip=$("tip");if(tip)tip.hidden=true;var hc=$("hcol");if(hc)hc.setAttribute("opacity","0");var hd=$("hdot");if(hd)hd.setAttribute("opacity","0");
  var svg=$("chart").querySelector("svg");if(svg)Array.prototype.forEach.call(svg.querySelectorAll(".xl"),function(el){el.setAttribute("fill","#8aa0b4");el.setAttribute("font-weight","400")})}
function evOrder(id){return chartTeams().filter(function(t){return has(t,id)}).sort(function(a,b){return pts(b,id)-pts(a,id)})}
$("chart").addEventListener("pointermove",function(ev){if(ev.pointerType!=="mouse")return;var p=nearest(ev);if(p)showTip(p.t,p.i)});
$("chart").addEventListener("pointerleave",function(ev){if(ev.pointerType==="mouse")hideTip()});
$("chart").addEventListener("click",function(ev){var xl=ev.target.closest&&ev.target.closest(".xl"),c=xl?+xl.dataset.i:colAt(ev);if(xl){ui.ev=c;renderChart();renderEv();hideTip();$("evp").scrollIntoView({behavior:"smooth",block:"start"});return}if(c){ui.ev=c;renderChart();renderEv();}var p=nearest(ev);if(!p){hideTip();return}if(ui.hover&&ui.hover.t===p.t&&ui.hover.i===p.i&&ev.pointerType!=="mouse"){hideTip();return}showTip(p.t,p.i)});

/* ---------- saisie ---------- */
function renderAdmin(){
  var a=$("admin");
  if(ui.login&&!ui.admin){a.innerHTML='<section class="card"><h2>Accès saisie</h2><p class="sub">'+(REMOTE?'Entre le code pour saisir les résultats.':'Mode local : les saisies restent sur cet appareil.')+'</p><form id="login" class="grid2"><label class="full" for="pin">Code<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><div class="full"><button class="big-btn" type="submit">Entrer</button></div><div class="full msg '+ui.msgKind+'">'+esc(ui.msg)+'</div></form></section>';return}
  if(!ui.admin){a.innerHTML="";return}
  var t=T(ui.adm.team)||ref();ui.adm.team=t.id;
  if(!ui.adm.ev||ORDER.indexOf(ui.adm.ev)<0)ui.adm.ev=ORDER.filter(function(id){return!has(t,id)})[0]||ORDER[0];
  var id=ui.adm.ev,x=t.results[id]||{};
  var h='<section class="card"><h2>Saisie</h2><form id="qform" class="grid2">';
  h+='<label class="full" for="q-team">Club<select id="q-team">'+state.teams.map(function(z){return'<option value="'+esc(z.id)+'"'+(z===t?' selected':'')+'>'+esc(z.name)+'</option>'}).join("")+'</select></label>';
  h+='<label class="full" for="q-ev">Course<select id="q-ev">'+ORDER.map(function(z,i){return'<option value="'+z+'"'+(z===id?' selected':'')+'>'+(i+1)+'. '+esc(EV[z].f)+(has(t,z)?' ✓':'')+'</option>'}).join("")+'</select></label>';
  h+='<label for="q-p">Points<input id="q-p" inputmode="numeric" autocomplete="off" value="'+(x.p!=null?x.p:'')+'" placeholder="1250"></label>';
  h+='<label for="q-t">Temps<input id="q-t" autocomplete="off" value="'+esc(x.t||'')+'" placeholder="1:02.35"></label>';
  h+='<label class="full" for="q-s">'+(EV[id].relay?'Relayeurs dans l’ordre, séparés par des virgules':'Nageur')+'<input id="q-s" autocomplete="off" value="'+esc((x.s||[]).join(", "))+'"></label>';
  h+='<div class="full"><button class="big-btn" type="submit"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Envoi…':'Valider')+'</button></div><div class="full msg '+ui.msgKind+'" id="msg">'+esc(ui.msg)+'</div></form>';
  if(has(t,id))h+='<button class="ghost danger" id="q-del">Effacer ce résultat</button>';
  h+='</section>';
  h+='<section class="card"><h2>Clubs</h2><div class="grid2"><label class="full" for="nc">Nouveau club<input id="nc" placeholder="Nom court, ex. Nice 1"></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="nc-us" style="width:auto"> c’est nous</label><button class="ghost" id="nc-add">Ajouter</button></div><div class="list">';
  state.teams.forEach(function(z){h+='<div class="li"><span>'+esc(z.name)+' <span class="sub">'+done(z)+'/'+N+'</span></span>'+(ui.delAsk===z.id?'<button class="ghost danger" data-delok="'+esc(z.id)+'">Confirmer</button><button class="ghost" data-delno="1">Annuler</button>':'<button class="ghost" data-del="'+esc(z.id)+'">Retirer</button>')+'</div>'});
  h+='</div></section>';
  h+='<section class="card"><h2>Sauvegarde</h2><textarea id="io" spellcheck="false" aria-label="Données"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="io-out">Afficher les données</button><button class="ghost" id="io-in">Importer le texte collé</button><button class="ghost" id="logout">Quitter la saisie</button></div></section>';
  a.innerHTML=h;
}

function renderFoot(){$("foot").innerHTML='<span>'+(state.updated?'Mis à jour '+new Date(state.updated).toLocaleString("fr-FR",{weekday:"short",hour:"2-digit",minute:"2-digit"}):'')+'</span>'+((ui.admin||ui.login||(INART&&!CAN))?'':'<button id="open-login">Accès saisie</button>')}
function renderAll(){renderTop();renderChart();renderEv();renderAdmin();renderFoot()}

/* ---------- données ---------- */
/* Page publiée : on régénère le document complet avec les nouvelles données. */
function buildDoc(next){
  var reset="";try{var st=document.head.querySelector("style");if(st&&st.id!=="css")reset=st.textContent}catch(e){}
  if(!reset)reset=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var link=document.querySelector('link[rel="stylesheet"]');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(document.title)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    (link?'<link rel="stylesheet" href="'+link.getAttribute("href").replace(/&/g,"&amp;")+'">\n':'')+
    '<style id="css">'+$("css").textContent+'<\/style>\n'+
    '<template id="shell">'+$("shell").innerHTML+'<\/template>\n<div id="root"></div>\n'+
    '<script type="application/json" id="data">'+JSON.stringify(next).replace(/</g,"\\u003c")+'<\/script>\n'+
    '<script id="main">'+$("main").textContent+'<\/script></body></html>';
}
async function commit(next){
  next.updated=new Date().toISOString();
  if(REMOTE){
    if(!sb)throw new Error("Pas de connexion");
    var r=await sb.rpc("ic_save",{p_pin:ui.pin,p_id:CONFIG.rowId,p_data:next});
    if(r.error)throw new Error(r.error.message.indexOf("pin")>=0?"Code refusé":r.error.message);
  }else if(ART){
    try{await ART.publish(buildDoc(next))}
    catch(e){var c=e&&e.code;throw new Error(c==="conflict"?"Quelqu\u2019un a publié en même temps, la page se recharge.":(c==="not_writer"||c==="not_granted")?"Tu n\u2019as pas le droit de modifier cette page.":"Publication impossible ("+(c||"erreur")+")")}
  }else{try{localStorage.setItem(KEY,JSON.stringify(next))}catch(e){}}
  state=next;
}
async function save(next,ok){ui.busy=true;try{await commit(next);ui.msg=ok;ui.msgKind="ok"}catch(e){ui.msg=e.message||"Erreur";ui.msgKind="err"}ui.busy=false;renderAll()}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  if(b.id==="stlive"){stopPlay();ui.stage=null;renderTop();return}
  if(b.id==="stplay"){if(ui.play){stopPlay();renderTop();return}var v=1;setStage(1);ui.play=setInterval(function(){v++;if(v>autoStage()){stopPlay();ui.stage=null;renderTop();return}setStage(v)},900);renderTop();return}
  if(b.dataset.evstep){ui.ev=Math.max(1,Math.min(N,ui.ev+(+b.dataset.evstep)));hideTip();renderChart();renderEv();return}
  if(b.id==="open-login"&&CAN){ui.admin=true;ui.msg="";renderAdmin();renderFoot();$("admin").scrollIntoView({behavior:"smooth"});return}
  if(b.id==="open-login"){ui.login=true;ui.msg="";renderAdmin();renderFoot();$("admin").scrollIntoView({behavior:"smooth"});return}
  if(b.id==="logout"){ui.admin=false;ui.login=false;ui.pin="";renderAll();return}
  if(b.id==="q-del"){var n=clone(state);delete n.teams.filter(function(z){return z.id===ui.adm.team})[0].results[ui.adm.ev];save(n,"Résultat effacé");return}
  if(b.id==="nc-add"){var v=$("nc").value.trim();if(!v)return;var n2=clone(state);n2.teams.push({id:"c"+Date.now().toString(36),name:v,short:v,us:$("nc-us").checked,honor:!!($("nc-hon")&&$("nc-hon").checked),results:{}});save(n2,"Club ajouté");return}
  if(b.dataset.del){ui.delAsk=b.dataset.del;renderAdmin();return}
  if(b.dataset.delno){ui.delAsk=null;renderAdmin();return}
  if(b.dataset.delok){var n3=clone(state);n3.teams=n3.teams.filter(function(z){return z.id!==b.dataset.delok});ui.delAsk=null;save(n3,"Club retiré");return}
  if(b.id==="io-out"){$("io").value=JSON.stringify(state);$("io").select();return}
  if(b.id==="io-in"){try{var dd=JSON.parse($("io").value);if(!dd.teams)throw 0;save(dd,"Données importées")}catch(e){$("io").value="Texte invalide"}return}
});
document.addEventListener("submit",async function(ev){
  ev.preventDefault();
  if(ev.target.id==="login"){
    var pin=$("pin").value.trim();
    if(REMOTE){
      if(!sb){ui.msg="Connexion en cours, réessaie.";ui.msgKind="err";renderAdmin();return}
      var r=await sb.rpc("ic_check",{p_pin:pin});
      if(r.error||!r.data){ui.msg="Code incorrect";ui.msgKind="err";renderAdmin();return}
    }
    ui.pin=pin;ui.admin=true;ui.msg="";renderAdmin();renderFoot();return;
  }
  if(ev.target.id==="qform"){
    var p=$("q-p").value.replace(/\s/g,""),n=parseInt(p,10);
    if(p===""||isNaN(n)){$("msg").textContent="Entre les points";$("msg").className="full msg err";return}
    var next=clone(state),t=next.teams.filter(function(z){return z.id===ui.adm.team})[0],id=ui.adm.ev;
    t.results[id]={p:n,t:$("q-t").value.trim(),s:$("q-s").value.split(",").map(function(s){return s.trim()}).filter(Boolean)};
    var nx=ORDER.filter(function(z){return!t.results[z]})[0];
    ui.busy=true;
    try{await commit(next);ui.msg=EV[id].l+" enregistré : "+fmt(n)+" pts";ui.msgKind="ok";ui.adm.ev=nx||id}
    catch(e){ui.msg=e.message||"Erreur";ui.msgKind="err"}
    ui.busy=false;renderAll();
  }
});
document.addEventListener("input",function(ev){if(ev.target.id==="stage"){stopPlay();setStage(+ev.target.value)}});
document.addEventListener("change",function(ev){
  if(ev.target.id==="q-team"){ui.adm.team=ev.target.value;ui.adm.ev=null;ui.msg="";renderAdmin()}
  if(ev.target.id==="q-ev"){ui.adm.ev=ev.target.value;ui.msg="";renderAdmin()}
});
var rw=0;window.addEventListener("resize",function(){clearTimeout(rw);rw=setTimeout(renderChart,120)});
if(location.hash==="#saisie")ui.login=true;

/* ---------- direct Supabase ---------- */
function applyRemote(row){
  if(!row||!row.data||!row.data.teams)return;
  state=row.data;renderTop();renderChart();renderEv();renderFoot();
  if(ui.admin&&!ui.busy){var a=document.activeElement;if(!a||!a.closest||!a.closest("form"))renderAdmin()}
}
function connect(){
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
  s.onload=async function(){
    sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);
    var r=await sb.from("interclubs").select("data").eq("id",CONFIG.rowId).maybeSingle();
    if(r.data)applyRemote(r.data);else renderTop();
    sb.channel("ic-"+CONFIG.rowId).on("postgres_changes",{event:"*",schema:"public",table:"interclubs",filter:"id=eq."+CONFIG.rowId},function(p){applyRemote(p.new)}).subscribe();
    setInterval(async function(){var q=await sb.from("interclubs").select("data").eq("id",CONFIG.rowId).maybeSingle();if(q.data&&q.data.data&&q.data.data.updated!==state.updated)applyRemote(q.data)},30000);
  };
  s.onerror=function(){$("live").querySelector("span").textContent="Hors ligne"};
  document.head.appendChild(s);
}

renderAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(renderChart);
if(REMOTE)connect();
if(INART)Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(async function(r){
  ART=r[0];var u=r[1];try{CAN=!!(ART&&u&&await u.canEdit())}catch(e){CAN=false}
  renderTop();renderFoot();
}).catch(function(){});
})();
</script>
